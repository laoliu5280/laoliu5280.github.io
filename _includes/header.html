<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="{{ site.github.url }}/" class="site-title">
      {{ site.title }}
    </a>
    <nav class="site-nav">
      {% for item in site.data.settings.menu %}
        <a class="nav-link{% if page.url == item.url %} active{% endif %}" href="{{ site.github.url }}{{ item.url }}">
          {{ item.name | capitalize }}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>
