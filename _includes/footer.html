<footer class="site-footer">
  <div class="footer-social">
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" class="footer-social-link" title="{{ item.title }}"{% unless item.icon == 'email' %} target="_blank" rel="noopener"{% endunless %}>{% include social-icon.html icon=item.icon %}</a>
    {% endfor %}
  </div>
  <p class="footer-text">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
</footer>
