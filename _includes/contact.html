<section class="contact-section">
  <h3 class="section-title">Contact</h3>
  {% for contact in site.data.settings.contacts %}
  <div class="contact-card">
    <h4 class="contact-name">{{ contact.name }}</h4>
    <div class="contact-info">
      <div class="contact-item">
        <i class="fas fa-briefcase"></i>
        <span>{{ contact.title }}, {{ contact.department }}</span>
      </div>
      <div class="contact-item">
        <i class="fas fa-university"></i>
        <span>{{ contact.institution }}</span>
      </div>
      <div class="contact-item">
        <i class="fas fa-envelope"></i>
        <span><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></span>
      </div>
      <div class="contact-item">
        {% include social-icon.html icon='google-scholar' %}
        <span><a href="{{ contact.scholar }}" target="_blank" rel="noopener">Google Scholar</a></span>
      </div>
      <div class="contact-item">
        <i class="fab fa-linkedin"></i>
        <span><a href="{{ contact.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></span>
      </div>
    </div>
  </div>
  {% endfor %}
</section>
